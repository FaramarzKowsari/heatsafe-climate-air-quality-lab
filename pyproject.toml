[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "heatsafe-climate-air-quality-lab"
version = "0.1.0"
description = "Open-data AI and deterministic decision support for heatwaves, air quality, wildfire smoke, urban heat, home ventilation, and cooling resilience."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Faramarz Kowsari"}]
keywords = ["air-quality", "climate-change", "heatwave", "pm25", "wildfire-smoke", "environmental-ai"]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pandas>=2.2,<3",
  "numpy>=1.26,<3",
  "scipy>=1.13,<2",
  "scikit-learn>=1.5,<2",
  "httpx>=0.27,<1",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
research = ["torch>=2.3,<3", "statsmodels>=0.14,<1", "xarray>=2024.1", "polars>=1.0", "pyarrow>=16"]
dev = ["pytest>=8", "pytest-cov>=5", "mypy>=1.11", "ruff>=0.6", "types-PyYAML"]

[project.scripts]
heatsafe = "heatsafe.cli:main"
heatsafe-data = "heatsafe.data_foundation.cli:main"
heatsafe-nexus = "heatsafe.research.nexus.cli:main"
heatsafe-transfer = "heatsafe.research.transfer.cli:main"
heatsafe-registry = "heatsafe.research.benchmark_registry.cli:main"

[project.urls]
Homepage = "https://github.com/FaramarzKowsari/heatsafe-climate-air-quality-lab"
Repository = "https://github.com/FaramarzKowsari/heatsafe-climate-air-quality-lab"
Issues = "https://github.com/FaramarzKowsari/heatsafe-climate-air-quality-lab/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
exclude = ["apps/web", "notebooks"]
