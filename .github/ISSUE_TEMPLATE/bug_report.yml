name: Bug report
description: Report a reproducible defect
title: "[Bug]: "
body:
  - type: textarea
    id: summary
    attributes: {label: Summary}
    validations: {required: true}
  - type: textarea
    id: reproduce
    attributes: {label: Reproduction steps}
    validations: {required: true}
  - type: input
    id: version
    attributes: {label: Version or commit}
