name: Research experiment
description: Propose a reproducible scientific experiment
title: "[Experiment]: "
body:
  - type: textarea
    id: question
    attributes:
      label: Research question or hypothesis
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: Data sources, provenance and license
    validations:
      required: true
  - type: textarea
    id: split
    attributes:
      label: Train, calibration, test and domain-shift protocol
    validations:
      required: true
  - type: textarea
    id: baselines
    attributes:
      label: Baselines, metrics and uncertainty
    validations:
      required: true
  - type: textarea
    id: artifacts
    attributes:
      label: Reproduction command and expected artifacts
    validations:
      required: true
