name: Deploy documentation pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/site/**"
      - "scripts/apply_site_discovery.py"
      - "scripts/generate_sitemap.py"
      - "scripts/validate_site_discovery.py"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: "${{ steps.deployment.outputs.page_url }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Apply canonical discovery metadata
        run: >
          python scripts/apply_site_discovery.py
          --site-root docs/site
      - name: Generate sitemap files
        run: >
          python scripts/generate_sitemap.py
          --site-root docs/site
      - name: Validate discovery and indexing files
        run: >
          python scripts/validate_site_discovery.py
          --site-root docs/site
          --report artifacts/site-discovery-validation.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site
      - id: deployment
        uses: actions/deploy-pages@v4
