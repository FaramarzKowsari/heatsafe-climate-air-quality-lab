name: External Validation
on:
  push:
    paths:
      - "src/heatsafe/research/transfer/**"
      - "src/heatsafe/api/external_validation.py"
      - "tests/test_transfer_*.py"
      - "tests/test_external_validation*.py"
      - "benchmarks/external-validation/**"
      - ".github/workflows/external-validation.yml"
  pull_request:
    paths:
      - "src/heatsafe/research/transfer/**"
      - "src/heatsafe/api/external_validation.py"
      - "tests/test_transfer_*.py"
      - "tests/test_external_validation*.py"
      - "benchmarks/external-validation/**"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "${{ matrix.python-version }}"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Lint external-validation laboratory
        run: >
          ruff check
          src/heatsafe/research/transfer
          src/heatsafe/api/external_validation.py
          tests/test_transfer_dataset.py
          tests/test_transfer_statistics.py
          tests/test_external_validation.py
          tests/test_external_validation_artifacts.py
          tests/test_external_validation_api.py
      - name: Type-check external-validation laboratory
        env:
          MYPY_PYTHON_VERSION: ${{ matrix.python-version }}
        run: >
          python -m mypy
          --python-version "$MYPY_PYTHON_VERSION"
          src/heatsafe/research/transfer
          src/heatsafe/api/external_validation.py
      - name: Run external-validation tests
        run: >
          pytest
          tests/test_transfer_dataset.py
          tests/test_transfer_statistics.py
          tests/test_external_validation.py
          tests/test_external_validation_artifacts.py
          tests/test_external_validation_api.py
          -q
      - name: Generate deterministic external-validation artifacts
        run: |
          heatsafe-transfer synthetic \
            --rows-per-city 420 \
            --seed 42 \
            --output /tmp/multicity.csv
          heatsafe-transfer run /tmp/multicity.csv \
            --target-column pm25 \
            --features temperature_c,relative_humidity_pct,wind_speed_kmh,smoke_proxy \
            --horizons 1 \
            --minimum-rows-per-city 360 \
            --bootstrap-repetitions 30 \
            --block-length 12 \
            --models persistence,ridge \
            --output /tmp/external-validation-artifacts
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: external-validation-artifacts
          path: /tmp/external-validation-artifacts
