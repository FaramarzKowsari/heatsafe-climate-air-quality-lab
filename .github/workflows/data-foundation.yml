name: Data Foundation
on:
  push:
    paths:
      - "src/heatsafe/data_foundation/**"
      - "src/heatsafe/connectors/**"
      - "src/heatsafe/api/data_foundation.py"
      - "tests/test_data_foundation.py"
      - "tests/test_resilient_http.py"
      - "tests/test_official_connectors.py"
      - "tests/test_era5_spec.py"
      - ".github/workflows/data-foundation.yml"
  pull_request:
    paths:
      - "src/heatsafe/data_foundation/**"
      - "src/heatsafe/connectors/**"
      - "src/heatsafe/api/data_foundation.py"
      - "tests/test_data_foundation.py"
      - "tests/test_resilient_http.py"
      - "tests/test_official_connectors.py"
      - "tests/test_era5_spec.py"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: {python-version: "${{ matrix.python-version }}"}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check src/heatsafe/data_foundation src/heatsafe/connectors tests/test_data_foundation.py tests/test_resilient_http.py tests/test_official_connectors.py tests/test_era5_spec.py
      - run: mypy src/heatsafe/data_foundation src/heatsafe/connectors/base.py src/heatsafe/connectors/noaa_cdo.py src/heatsafe/connectors/epa_aqs.py src/heatsafe/connectors/nasa_firms.py src/heatsafe/connectors/eea_parquet.py src/heatsafe/api/data_foundation.py
      - run: pytest tests/test_data_foundation.py tests/test_resilient_http.py tests/test_official_connectors.py tests/test_era5_spec.py -q
