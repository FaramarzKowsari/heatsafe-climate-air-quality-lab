name: Site Discovery and Search Indexing

on:
  workflow_dispatch:
  push:
    paths:
      - "docs/site/**"
      - "scripts/apply_site_discovery.py"
      - "scripts/generate_sitemap.py"
      - "scripts/validate_site_discovery.py"
      - ".github/workflows/site-discovery.yml"
  pull_request:
    paths:
      - "docs/site/**"
      - "scripts/apply_site_discovery.py"
      - "scripts/generate_sitemap.py"
      - "scripts/validate_site_discovery.py"
      - ".github/workflows/site-discovery.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify canonical metadata is current
        run: >
          python scripts/apply_site_discovery.py
          --site-root docs/site
          --check
      - name: Verify sitemap files are current
        run: >
          python scripts/generate_sitemap.py
          --site-root docs/site
          --check
      - name: Validate public discovery surface
        run: >
          python scripts/validate_site_discovery.py
          --site-root docs/site
          --report artifacts/site-discovery-validation.json
      - uses: actions/upload-artifact@v4
        with:
          name: site-discovery-validation
          path: artifacts/site-discovery-validation.json
