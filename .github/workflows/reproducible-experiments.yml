name: Reproducible Experiments

on:
  push:
    paths:
      - "src/heatsafe/research/experiment_orchestrator/**"
      - "tests/test_experiment_orchestrator.py"
      - "examples/experiments/**"
      - "EXPERIMENT_ORCHESTRATOR.md"
      - "docs/site/reproducible-experiments/**"
      - ".github/workflows/reproducible-experiments.yml"
      - "pyproject.toml"
  pull_request:
    paths:
      - "src/heatsafe/research/experiment_orchestrator/**"
      - "tests/test_experiment_orchestrator.py"
      - "examples/experiments/**"
      - "EXPERIMENT_ORCHESTRATOR.md"
      - "docs/site/reproducible-experiments/**"
      - ".github/workflows/reproducible-experiments.yml"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Lint experiment orchestrator
        run: >
          ruff check
          src/heatsafe/research/experiment_orchestrator
          tests/test_experiment_orchestrator.py
      - name: Type-check experiment orchestrator
        env:
          MYPY_PYTHON_VERSION: ${{ matrix.python-version }}
        run: >
          python -m mypy
          --python-version "$MYPY_PYTHON_VERSION"
          src/heatsafe/research/experiment_orchestrator
      - name: Run experiment orchestrator tests
        run: pytest tests/test_experiment_orchestrator.py -q
      - name: Generate paper-ready demonstration
        run: |
          heatsafe-experiment run             --spec examples/experiments/heataq-nexus-synthetic.json             --output /tmp/heatsafe-paper-ready             --repository-root .
          heatsafe-experiment verify /tmp/heatsafe-paper-ready
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: heatsafe-paper-ready-experiment
          path: /tmp/heatsafe-paper-ready
